# ZORA 2.0 Extra Raft Blocks (docs/design/zora-flags-2.0.md section 3): water and docks in
# the overworld's screen layouts, so Westlake Mall and Casino Corner need the raft. These
# bytes are column descriptors in RoomLayoutsOW (bank 5 $9418, file 0x15428; 16 a layout),
# which the pinned disassembly includes as a binary, so they are data edits, not hooks
# (asm/flags2/build.py). A layout may serve more than one screen: the build reports the
# screens each edit reaches. asm/README.md describes the rest of this file.

