# ZORA FP-ENTR-01 with the start-room swap (B26, PS-START-03): arrival codes 1, 3 and 4 place Link
# at the start room's open side, facing into the room. Left out unless B26 moves a start room
# (zora/rom/code_patches.py), so a ROM without B26 keeps fp-entr-01's bytes.
# asm/README.md describes this file.

[[segment]]
name = "ZORA_FP_ENTR_01_SIDES"
bank = 5
start = 0xBC40              # after fp-stats-01's slot $BC00-$BC3F (docs/rom-map.md)

[[hook]]
name = "place-link"
offset = 0x17054
length = 3
note = "fp-entr-01's JMP PlaceLinkByArrivalCode becomes JMP PlaceLinkBySide, which handles codes 1, 3 and 4 and jumps on to PlaceLinkByArrivalCode for the others."
code = """
    JMP PlaceLinkBySide
"""
