# ZORA FP-STATS-01 for ROMs with randomized music (the player setting Randomize music; docs/music.md):
# the same code (asm/fp-stats-01, `routines_from`), its block in SRAM at $7F00-$7F3F as there, which
# lozft's driver leaves free (its own SRAM is $7F40-$7FFD), with StatsTick moved out of lozft's
# bank-0 song table and glue ($8000-$82A0) to $B000. asm/README.md describes this file.

routines_from = "../fp-stats-01"

[[segment]]
name = "ZORA_FP_STATS_TICK"
bank = 0
start = 0xB000          # bank 0's free $9FF9-$BEFF: lozft's song table and glue fill $8000-$82A0

[[segment]]
name = "ZORA_FP_STATS_SCREEN"
bank = 2
start = 0xB100

[[segment]]
name = "ZORA_FP_STATS_LEVELS"
bank = 2
start = 0xB7B0          # the shown level numbers (player_settings.statistics_screen writes them)

[[segment]]
name = "ZORA_FP_STATS_STAB"
bank = 5
start = 0xBC00

[imports]
bank_07 = ["StatsTick"]

[exports]
bank_00 = ["StatsTick"]

[[hook]]
name = "tick"
offset = 0x1E571
length = 3
note = "IsrNmi: JSR DriveAudio (bank 0 is in) calls StatsTick, which ends by jumping to DriveAudio."
code = """
    JSR StatsTick
"""

[[hook]]
name = "stab"
offset = 0x14E25
length = 5
note = "WieldSword, once a swing starts: LDA #$01 / JMP PlayEffect becomes JMP CountStab + 2 NOPs."
code = """
    JMP CountStab
    NOP
    NOP
"""

[[hook]]
name = "death-warp"
offset = 0x140F2
length = 3
note = "UpdateMenuActive, once the death-warp buttons are down (their test, 0x140EA-0x140F1, is FP-RESET-01's): JSR EndGameMode becomes JSR CountDeathWarp, which jumps to EndGameMode."
code = """
    JSR CountDeathWarp
"""

[[hook]]
name = "screen"
offset = 0x0AB8F
length = 3
note = "UpdateMode13WinGame_Sub4: JSR HideAllSprites calls StatsFrame, which shows the screen on Start."
code = """
    JSR StatsFrame
"""

[[hook]]
name = "register"
offset = 0x09F80
length = 5
note = "UpdateModeERegister's @FlagBReady, for a new file: LDA #$01 / STA $0426 becomes JSR ClearStatsOnRegister + 2 NOPs (after FP-START-01's starting values, which ZORA reads back)."
code = """
    JSR ClearStatsOnRegister
    NOP
    NOP
"""

[[hook]]
name = "self-burn"
offset = 0x1F909
length = 20
note = "UpdateFire, once the player's own flame (the candle's, or the wand's with the Book) touches Link and he is not invincible: LDX $00 / LDY #$00 / STY $00 / JSR BeginShove / LDA #$00 / STA $0D / LDA #$80 / STA $0E / JMP Link_BeHarmed (20 bytes) becomes the same with SelfBurns incremented before the JMP. DoObjectsCollide has left X = 0 and Y = the fire's slot (its [00]), so STX $00 / TYA / TAX is shorter than the reload, and BeginShove leaves Y = 0 (its [00]) for STY $0D; that makes room for the INC, and one NOP. Bank 7, so it works with any bank switched in."
code = """
    STX $00
    TYA
    TAX
    JSR BeginShove
    STY $0D
    LDA #$80
    STA $0E
    INC $7F3F                   ; SelfBurns (asm/fp-stats-01/bank_00.s; capped at 255 by CapSelfBurns)
    JMP Link_BeHarmed
    NOP
"""
