# --- Shared bytes ---------------------------------------------------------------------------------
# Two owners write the same byte only where a [[shared]] row names both and the range. `together`
# says how: "chained" (both may be on in one ROM: the later writer builds on the earlier's bytes,
# as a setting choice rewriting ZORA's code does), "exclusive" (the flag rules refuse them together:
# `refused_by` names the zora_flags check), or "retired" (one of them is never written).

[[shared]]
owners = ["z1rr-coop", "flags2:pegasus-boots", "site:link-speed-hook"]
ranges = [[5, 0xB366, 0xB369]]
together = "chained"
why = """InitLinkSpeed's first two instructions. Pegasus Boots (owner spec, 2026-10-17), Slow Speed
(C19 = 2; owner ruling, 2026-10-22) and Rupees Affect Speed (B80) each call their routine there, and
with more than one on the later routine calls the earlier (zora/rom/small_settings.py). z1rr-coop's
beta 8 patch hooks them too, so its bridge refuses such a ROM; revision 1 leaves them as PRG0's."""
flags = { z1r = { C19 = 2, B80 = "on" }, zora = { pegasus_boots = "on" } }

[[shared]]
owners = ["series:fp-entr-01", "series:fp-entr-01-sides"]
ranges = [[5, 0xB045, 0xB046]]
together = "chained"
why = "fp-entr-01-sides points fp-entr-01's JMP at PlaceLinkBySide (B26 with a moved start room)."

[[shared]]
owners = ["series:fp-fix-02", "setting:reduce_flashing"]
ranges = [[1, 0xBEC7, 0xBEC8]]
together = "chained"
why = "Reduce flashing's choices rewrite an operand of fp-fix-02's SelectFanfarePaletteIfIdle."

[[shared]]
owners = ["series:fp-hot-01", "setting:select_swap"]
ranges = [[2, 0xB000, 0xB07F], [5, 0x80D5, 0x80D6], [6, 0xA030, 0xA031], [7, 0xEC36, 0xEC39]]
together = "chained"
why = "Select swap's choices replace fp-hot-01's play routine and its hooks (player setting, FP-SET-01)."

[[shared]]
owners = ["series:fp-hot-01", "setting:death_warp"]
ranges = [[5, 0xB9C0, 0xBA3F]]
together = "chained"
why = "Death warp's choices rewrite fp-hot-01's menu routine (player setting, FP-SET-01)."

[[shared]]
owners = ["series:fp-prog-01", "asnb:sword-cap"]
