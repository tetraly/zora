# ROM space: PRG0's free space, the ranges reserved for others, and every claim on them
# (docs/rom-map.md; asm/rom_space.py reads this file; asm/README.md "Adding a patch").
#
# Addresses are CPU addresses in a bank, inclusive: banks 0-6 switch at $8000, bank 7 is fixed
# at $C000. This is the one copy of each range: the patch builders place new segments from it,
# tests/test_rom_space.py checks every builder's bytes, the reservations and the per-seed sites
# against it, and tests/test_coop_reserved.py reads z1rr-coop's ranges from it.
#
# The 256 KB layout of randomized music (docs/music.md: lozft moves the fixed bank to bank 15 and
# fills bank 0 $8000-$82A0) has no table yet. It would go here as a second set of [[free]] rows
# (with a `layout = "music"` key), which asm/rom_space.py would use for a patch built for that
# layout; until then the one such patch, asm/fp-stats-01-music, keeps its hand-chosen address.

# --- Free space in PRG0 --------------------------------------------------------------------------
